name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require tag and source version to match
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)"
  build:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish tested, asset-free packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" *.zip SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            --title "SOTN Native ${GITHUB_REF_NAME}"

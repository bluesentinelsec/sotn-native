name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/check_repository.py
      - run: python3 -m unittest discover -s tests -v

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev \
            libwayland-dev libdecor-0-dev libpipewire-0.3-dev xvfb xauth libgl1-mesa-dri libglx-mesa0
      - name: Windows software OpenGL for tests only
        if: runner.os == 'Windows'
        run: python3 scripts/setup_windows_mesa.py build/test-tools/mesa
      - name: Build and test Debug and Release
        run: |
          for config in Debug Release; do
            directory="build/${config}"
            cmake -S . -B "${directory}" -G Ninja -DCMAKE_BUILD_TYPE="${config}"
            cmake --build "${directory}" --parallel 4
            ctest --test-dir "${directory}" --output-on-failure
            case "${RUNNER_OS}" in
              macOS) python3 scripts/test_graphics.py "${directory}/bin/sotn-native.app/Contents/MacOS/sotn-native" ;;
              Windows) python3 scripts/test_graphics.py "${directory}/bin/sotn-native.exe" --mesa-dir build/test-tools/mesa/x64 ;;
              Linux) LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a python3 scripts/test_graphics.py "${directory}/bin/sotn-native" ;;
            esac
          done
      - name: Verify static SDL linkage
        run: |
          case "${RUNNER_OS}" in
            macOS) binary=build/Release/bin/sotn-native.app/Contents/MacOS/sotn-native ;;
            Windows) binary=build/Release/bin/sotn-native.exe ;;
            Linux) binary=build/Release/bin/sotn-native ;;
          esac
          python3 scripts/check_linkage.py "${binary}"
      - name: Package the tested Release app
        run: cmake --build build/Release --target package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  sanitizers:
    name: Linux (ASan / UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Build the instrumented app and SDL
        run: >-
          make sanitizer JOBS=4
          CMAKE_FLAGS="-G Ninja -DSDL_UNIX_CONSOLE_BUILD=ON"

  web:
    name: Web (Emscripten / browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '6.0.13'
          actions-cache-folder: emsdk-cache
      - name: Build WebAssembly from the same SDL source
        run: |
          emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/web --parallel 4
      - name: Run the app in a real browser
        run: python3 scripts/test_web.py build/web/bin
      - name: Package web app
        run: cmake --build build/web --target package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-web
          path: dist/*.zip
          if-no-files-found: error

  android:
    name: Android (APK / emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install native build tools
        run: sdkmanager 'platforms;android-35' 'ndk;28.2.13676358' 'cmake;3.31.6'
      - name: Build Debug and unsigned Release APKs
        run: platforms/android/gradlew -p platforms/android --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: python3 scripts/test_android.py platforms/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Package unsigned Android release
        run: python3 scripts/package_android.py platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-android
          path: dist/*.zip
          if-no-files-found: error

  ios:
    name: iOS (device / simulator)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build simulator and unsigned device apps
        run: |
          for sdk in iphonesimulator iphoneos; do
            cmake -S . -B "build/${sdk}" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT="${sdk}" -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
            cmake --build "build/${sdk}" --config Release --parallel 4
          done
      - name: Run the app in iOS Simulator
        run: python3 scripts/test_ios.py build/iphonesimulator/bin/sotn-native.app
      - name: Package simulator and unsigned device apps
        run: |
          cpack --config build/iphonesimulator/CPackConfig.cmake -C Release
          cpack --config build/iphoneos/CPackConfig.cmake -C Release
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-ios
          path: dist/*.zip
          if-no-files-found: error
